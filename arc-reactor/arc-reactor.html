<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Arc Reactor — Anatomy</title><style>
.iso{

  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;

  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;

  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;

.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(980px,100% - 32px);margin:64px auto 96px}
</style></head><body class="iso" data-theme="dark"><main class="iso-page"><style>.arc {
  --arc-blend: screen;
  --arc-button-hover: #162032;
  --arc-button-ring: rgba(56, 189, 248, 0.25);
  --arc-part-ring: rgba(255, 255, 255, 0.1);
  --arc-part-hover: rgba(56, 189, 248, 0.08);
  --arc-lamp-off: #334155;
  --arc-lamp-on: #38bdf8;
  --arc-lamp-glow: rgba(56, 189, 248, 0.7);
  --arc-core: #e0f2fe;
  --arc-plasma: #0284c7;
  --arc-plasma-glow: rgba(56, 189, 248, 0.45);
  --arc-mhd: #f59e0b;
  --arc-coil: #f97316;
}

[data-theme="light"] .arc {
  --arc-blend: normal;
  --arc-button-hover: #e0f2fe;
  --arc-button-ring: rgba(2, 132, 199, 0.3);
  --arc-part-ring: rgba(0, 0, 0, 0.12);
  --arc-part-hover: rgba(2, 132, 199, 0.08);
  --arc-lamp-off: #94a3b8;
  --arc-lamp-on: #0284c7;
  --arc-lamp-glow: rgba(2, 132, 199, 0.4);
  --arc-core: #0369a1;
  --arc-plasma: #0284c7;
  --arc-plasma-glow: rgba(2, 132, 199, 0.2);
  --arc-mhd: #d97706;
  --arc-coil: #ea580c;
}

.arc .iso-plate {
  padding: 48px 24px 60px;
  overflow: hidden;
  position: relative;
}

.arc-stage {
  position: relative;
  border-radius: 8px;
  touch-action: pan-y;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
  cursor: grab;
}

.arc-stage:active {
  cursor: grabbing;
}

.arc-stage:focus-visible {
  outline: 1px solid var(--anatomy-mid);
  outline-offset: 4px;
}

.arc-stage > svg,
.arc-stage > canvas {
  display: block;
  width: 100%;
  height: auto;
}

.arc-front,
.arc-plasma-canvas {
  position: absolute;
  inset: 0;
  height: 100% !important;
}

.arc-plasma-canvas {
  pointer-events: none;
  mix-blend-mode: var(--arc-blend);
}

.arc-front {
  pointer-events: none;
}

.arc-front .it {
  pointer-events: visiblePainted;
  transition: opacity 160ms cubic-bezier(0.2, 0, 0, 1);
}

.arc-stage[data-focus] .arc-front .it:not([data-on]) {
  opacity: 0.14;
}

.arc-stage[data-focus] .arc-front .it[data-on] {
  opacity: 1;
}

/* X-Ray / Flux View: Dims outer housing to inspect magnetic torus & coils */
.arc-stage[data-xray] .arc-front .it[data-piece="housing"],
.arc-stage[data-xray] .arc-front .it[data-piece="bezel"],
.arc-stage[data-xray] .arc-front .it[data-piece="lens"],
.arc-stage[data-xray] .arc-front .it[data-piece="stand"],
.arc-stage[data-xray] .arc-front .it[data-piece="cooling"] {
  opacity: 0.14;
}

.arc-stage[data-xray] .arc-front .it[data-piece="torus"],
.arc-stage[data-xray] .arc-front .it[data-piece="coils"],
.arc-stage[data-xray] .arc-front .it[data-piece="core"],
.arc-stage[data-xray] .arc-front .it[data-piece="mhd"] {
  opacity: 1 !important;
  filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.75));
}

/* Controls Bar */
.arc-controls {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  margin-top: 16px;
  font-family: var(--anatomy-mono);
  font-size: 11px;
}

.arc-btn-group {
  display: inline-flex;
  gap: 6px;
}

.arc-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  height: 32px;
  padding: 0 14px;
  border: 1px solid var(--anatomy-mid);
  border-radius: 4px;
  background: var(--anatomy-card);
  color: var(--anatomy-text);
  font-family: inherit;
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  cursor: pointer;
  transition: background 120ms ease, border-color 120ms ease, box-shadow 120ms ease;
}

.arc-btn:hover {
  background: var(--arc-button-hover);
  border-color: var(--anatomy-hi);
}

.arc-lamp {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--arc-lamp-off);
  box-shadow: none;
  transition: background 150ms ease, box-shadow 150ms ease;
}

.arc-btn[data-active] .arc-lamp {
  background: var(--arc-lamp-on);
  box-shadow: 0 0 8px var(--arc-lamp-glow);
}

.arc-hint {
  color: var(--anatomy-muted);
  letter-spacing: 0.03em;
  text-transform: uppercase;
  font-size: 10.5px;
}

.arc-live {
  margin-left: auto;
  color: var(--anatomy-hi);
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.04em;
  font-weight: 500;
}

/* Reactor Diagnostics Telemetry Console */
.arc-console {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin: 14px 0 12px;
  padding: 12px 18px;
  border: 1px solid var(--arc-button-ring);
  border-radius: 6px;
  background: var(--anatomy-card);
  font-family: var(--anatomy-mono);
}

.arc-telemetry {
  display: flex;
  flex-wrap: wrap;
  gap: 20px;
  font-size: 11px;
}

.arc-telem-item {
  display: flex;
  flex-direction: column;
}

.arc-telem-label {
  font-size: 9px;
  color: var(--anatomy-muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.arc-telem-val {
  font-weight: 600;
  color: var(--anatomy-text);
  font-variant-numeric: tabular-nums;
  margin-top: 2px;
}

/* 10-Coil Diagnostics Array */
.arc-coils-wrap {
  margin: 10px 0;
}

.arc-coils-label {
  display: flex;
  justify-content: space-between;
  font-family: var(--anatomy-mono);
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--anatomy-muted);
  margin-bottom: 4px;
}

.arc-coils-strip {
  display: grid;
  grid-template-columns: repeat(10, 1fr);
  gap: 5px;
  font-family: var(--anatomy-mono);
  font-size: 9.5px;
}

.arc-coil-pill {
  padding: 4px 2px;
  border: 1px solid var(--anatomy-mid);
  border-radius: 3px;
  text-align: center;
  background: var(--anatomy-card);
  color: var(--anatomy-muted);
  transition: border-color 100ms, background 100ms, color 100ms;
}

.arc-coil-pill[data-active] {
  border-color: var(--arc-lamp-on);
  background: var(--arc-plasma-glow);
  color: var(--anatomy-lit);
  box-shadow: 0 0 6px var(--arc-plasma-glow);
}

/* Power Output Throttle Slider */
.arc-power-bar {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 10px 0 12px;
  font-family: var(--anatomy-mono);
  font-size: 10.5px;
  color: var(--anatomy-muted);
}

.arc-power-slider {
  flex: 1;
  -webkit-appearance: none;
  appearance: none;
  height: 4px;
  border-radius: 2px;
  background: var(--anatomy-mid);
  outline: none;
  cursor: pointer;
}

.arc-power-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--arc-lamp-on);
  cursor: grab;
  box-shadow: 0 0 8px var(--arc-lamp-glow);
}

.arc-power-slider::-moz-range-thumb {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--arc-lamp-on);
  cursor: grab;
  border: none;
}

/* Parts Buttons Grid */
.arc-parts {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin: 12px 0 10px;
}

.arc-part-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 25px;
  padding: 0 10px;
  border: 1px solid var(--arc-part-ring);
  border-radius: 3px;
  background: transparent;
  color: var(--anatomy-muted);
  font-family: var(--anatomy-mono);
  font-size: 10.5px;
  cursor: pointer;
  transition: color 120ms, border-color 120ms, background 120ms;
}

.arc-part-btn:hover {
  color: var(--anatomy-text);
  background: var(--arc-part-hover);
  border-color: var(--anatomy-mid);
}

.arc-part-btn[data-on] {
  color: var(--anatomy-text);
  background: var(--arc-button-hover);
  border-color: var(--anatomy-hi);
}

.arc-part-num {
  opacity: 0.5;
  font-size: 9px;
}

@media (max-width: 768px) {
  .arc .iso-plate {
    padding: 44px 12px 60px;
  }
  .arc-controls {
    flex-direction: column;
    align-items: stretch;
    gap: 10px;
  }
  .arc-console {
    flex-direction: column;
    align-items: stretch;
  }
  .arc-telemetry {
    justify-content: space-between;
  }
  .arc-coils-strip {
    grid-template-columns: repeat(5, 1fr);
  }
}

const VERTEX = "attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}";

function glLayer({ canvas, fragment, view, camera, uniforms = [], fixed = {}, extensions = [], maxRatio = 1.5, onError = (message) => console.error(message) }) {

  gl.attachShader(program, vs);
  gl.attachShader(program, fs);

  const buffer = gl.createBuffer();

  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const position = gl.getAttribLocation(program, "p");
  gl.enableVertexAttribArray(position);
  gl.vertexAttribPointer(position, 2, gl.FLOAT, false, 0, 0);
  const where = {};
  for (const name of ["uCanvas", "uView", "uOrigin", "uK", "uCam", "uTime", ...uniforms, ...Object.keys(fixed)]) where[name] = gl.getUniformLocation(program, name);
  const types = {};
  const active = gl.getProgramParameter(program, gl.ACTIVE_UNIFORMS);
  for (let index = 0; index < active; index++) {
    const info = gl.getActiveUniform(program, index);

  const fit = () => {
    const box = canvas.getBoundingClientRect();
    const ratio = Math.min(maxRatio, window.devicePixelRatio || 1);
    const width = Math.max(1, Math.round(box.width * ratio));
    const height = Math.max(1, Math.round(box.height * ratio));
    if (canvas.width !== width || canvas.height !== height) {
      canvas.width = width;
      canvas.height = height;
    }

      if (type === gl.FLOAT_VEC2) gl.uniform2fv(at, data);
      else if (type === gl.FLOAT_VEC3) gl.uniform3fv(at, data);
      else if (type === gl.FLOAT_VEC4) gl.uniform4fv(at, data);

    else if (value.length === 2) gl.uniform2f(at, value[0], value[1]);
    else if (value.length === 3) gl.uniform3f(at, value[0], value[1], value[2]);
    else if (value.length === 4) gl.uniform4f(at, value[0], value[1], value[2], value[3]);

  for (const [name, value] of Object.entries(fixed)) set(name, value);
  return {
    gl,
    extensions: enabled,
    set(values = {}) {
      for (const [name, value] of Object.entries(values)) set(name, value);
    },
    draw(values = {}, time = 0) {
      fit();
      gl.viewport(0, 0, canvas.width, canvas.height);
      set("uCanvas", [canvas.width, canvas.height]);
      set("uView", view);
      set("uOrigin", camera.origin);
      set("uK", camera.k);
      set("uCam", camera.cam);
      set("uTime", time);
      for (const [name, value] of Object.entries(values)) set(name, value);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      painted = true;
    },
    clear() {
      if (!painted) return;
      gl.clearColor(0, 0, 0, 0);
      gl.clear(gl.COLOR_BUFFER_BIT);
      painted = false;
    },

}

const smooth = (a, b, x) => {
  const t = Math.min(1, Math.max(0, (x - a) / (b - a)));
  return t * t * (3 - 2 * t);
};

const burst = (age, rise, fall) => (age > 0 ? smooth(0, rise, age) * Math.exp(-Math.max(0, age - rise) / fall) : 0);

function settle(state, target, dt, seconds, calm = false) {
  if (calm) {
    state.x = target;
    state.v = 0;
    return false;
  }
  const w = 1 / seconds;
  for (let index = 0; index < 4; index++) {
    const h = dt / 4;
    state.v += (w * w * (target - state.x) - 2 * w * state.v) * h;
    state.x += state.v * h;
  }
  if (Math.abs(target - state.x) < 1e-4 && Math.abs(state.v) < 1e-4) {
    state.x = target;
    state.v = 0;
    return false;
  }
  return true;
}

inorR":7.5};
const root = document.querySelector(".arc");
const stage = root.querySelector(".arc-stage");
const front = stage.querySelector(".arc-front");
const engine = front.querySelector(".arc-engine");
const canvas = stage.querySelector(".arc-plasma-canvas");
const liveEl = root.querySelector("[data-live]");
const readout = root.querySelector("[data-readout]");
const runBtn = root.querySelector("[data-run]");
const apartBtn = root.querySelector("[data-apart]");
const xrayBtn = root.querySelector("[data-xray]");
const partBtns = [...root.querySelectorAll(".arc-part-btn")];
const coilPills = [...root.querySelectorAll(".arc-coil-pill")];
const powerSlider = root.querySelector(".arc-power-slider");
const telemPower = root.querySelector("[data-telem-power]");
const telemTemp = root.querySelector("[data-telem-temp]");
const telemField = root.querySelector("[data-telem-field]");
const telemDensity = root.querySelector("[data-telem-density]");
const telemEff = root.querySelector("[data-telem-eff]");
const still = matchMedia("(prefers-reduced-motion: reduce)");

const nodes = [...engine.querySelectorAll(".it")].map((el) => ({
  el,
  piece: el.dataset.piece,
  ride: el.dataset.ride || el.dataset.piece,
  role: el.dataset.role || null,
  key: Number(el.dataset.k),
  m: el.dataset.m.split(",").map(Number),
  index: Number(el.dataset.i),
  shown: "",
}));
for (const node of nodes) node.lift = node.m[0] * D.V[0] + node.m[1] * D.V[1] + node.m[2] * D.V[2];
let order = nodes.map((_, index) => index);

const IDS = Object.keys(D.pieces);
const STAGGER = D.stagger;
const SPRING = D.spring;
const piece = Object.fromEntries(IDS.map((id) => [id, { x: 0, v: 0, target: 0, pending: null }]));

// Reactor State
let running = !still.matches;
let apart = false;
let xray = false;
let selected = null;
let powerGj = 3.0; // 0.5 to 5.0 GJ/s (Gigawatts)
let clock = 0;
let lastTime = 0;
let frame = 0;
let visible = false;
let plasmaPhase = 0;

function steerSpring(state, dt, calm) {
  if (state.pending && clock >= state.pending.at) {
    state.target = state.pending.value;
    state.pending = null;
  }
  if (calm) {
    state.x = state.target;
    state.v = 0;
    return false;
  }
  for (let index = 0; index < SPRING.substeps; index++) {
    const h = dt / SPRING.substeps;
    state.v += ((state.target - state.x) * SPRING.stiffness - state.v * SPRING.damping) * h;
    state.x += state.v * h;
  }
  if (Math.abs(state.target - state.x) < 2e-4 && Math.abs(state.v) < 2e-4) {
    state.x = state.target;
    state.v = 0;
    return state.pending !== null;
  }
  return true;
}

function setApart(on) {
  apart = on;
  apartBtn.toggleAttribute("data-active", on);
  const goal = on ? 1 : 0;
  let index = 0;
  for (const id of on ? STAGGER : [...STAGGER].reverse()) {
    if (!piece[id]) continue;
    if (piece[id].target === goal) piece[id].pending = null;
    else piece[id].pending = { value: goal, at: clock + (still.matches ? 0 : index++ * SPRING.stagger) };
  }
  describe();
  run();
}

function setXray(on) {
  xray = on;
  if (xrayBtn) xrayBtn.toggleAttribute("data-active", on);
  if (on) stage.setAttribute("data-xray", "");
  else stage.removeAttribute("data-xray");
}

function selectPart(id) {
  if (id === "stand") id = null;
  if (selected === id) id = null;
  selected = id;
  for (const node of nodes) {
    if (id !== null && node.piece === id) node.el.setAttribute("data-on", "");
    else node.el.removeAttribute("data-on");
  }
  if (id) stage.setAttribute("data-focus", "");
  else stage.removeAttribute("data-focus");
  partBtns.forEach((btn) => (btn.dataset.part === id ? btn.setAttribute("data-on", "") : btn.removeAttribute("data-on")));
  describe();
}

function updateCoilPills() {
  if (!running) {
    coilPills.forEach((p) => p.removeAttribute("data-active"));
    return;
  }
  // 10 Coils distributed at 36 deg intervals
  const activeCoilIdx = Math.floor((((plasmaPhase * 180) / Math.PI) % 360) / 36);
  coilPills.forEach((p, idx) => {
    if (idx === activeCoilIdx || (idx + 5) % 10 === activeCoilIdx) {
      p.setAttribute("data-active", "");
    } else {
      p.removeAttribute("data-active");
    }
  });
}

function place() {
  for (const node of nodes) {
    const share = piece[node.ride].x;
    let tx = (D.EX[0] * node.m[0] + D.EY[0] * node.m[1] + D.EZ[0] * node.m[2]) * share;
    let ty = (D.EX[1] * node.m[0] + D.EY[1] * node.m[1] + D.EZ[1] * node.m[2]) * share;

    const text = share === 0 ? "" : `translate(${tx.toFixed(2)} ${ty.toFixed(2)})`;
    if (text !== node.shown) {
      node.shown = text;
      if (text) node.el.setAttribute("transform", text);
      else node.el.removeAttribute("transform");
    }
  }

  // Dynamic depth re-sorting during explode transitions
  const next = nodes
    .map((_, index) => index)
    .sort((a, b) => nodes[a].key + nodes[a].lift * piece[nodes[a].ride].x - (nodes[b].key + nodes[b].lift * piece[nodes[b].ride].x));
  if (next.some((index, at) => index !== order[at])) {
    const frag = document.createDocumentFragment();
    for (const index of next) frag.appendChild(nodes[index].el);
    engine.appendChild(frag);
    order = next;
  }
}

function describe() {
  const power = running ? powerGj : 0;
  const tempMK = running ? (85 + powerGj * 14.5).toFixed(1) : 0;
  const fieldT = running ? (10.2 + powerGj * 1.5).toFixed(1) : 0;
  const density = running ? (1.4 + powerGj * 0.22).toFixed(2) : 0;
  const eff = running ? 89.4 : 0;

  if (telemPower) telemPower.textContent = `${power.toFixed(2)} GJ/s (${(power * 1000).toFixed(0)} MW)`;
  if (telemTemp) telemTemp.textContent = `${tempMK} × 10⁶ K`;
  if (telemField) telemField.textContent = `${fieldT} Tesla`;
  if (telemDensity) telemDensity.textContent = `${density} × 10²⁰ m⁻³`;
  if (telemEff) telemEff.textContent = `${eff.toFixed(1)}% Direct MHD`;

  const text = running
    ? `ACTIVE · ${power.toFixed(2)} GJ/s · ${tempMK}M K CORE · ${fieldT} T CONFINEMENT · MHD ${eff.toFixed(1)}%`
    : apart
    ? `EXPLODED · ${D.order.length} ASSEMBLIES · INSPECT CORE`
    : `STANDBY · PALLADIUM CORE COLD · PRESS IGNITE`;

  if (readout.textContent !== text) readout.textContent = text;
  stage.setAttribute("aria-valuetext", text);
}

// WebGL Volumetric Plasma Torus, Magnetic Flux & Core Arc Shader
const FRAGMENT = `

      vec3 coreCol = mix(vec3(0.1, 0.75, 1.0), vec3(0.95, 0.98, 1.0), smoothstep(6.0, 0.0, dCore));

      vec2 pCoil = project(coilPt);

  "uApart",
  "uPower",

function tick(now) {

  lastTime = now;
  clock += dt;
  const calm = still.matches;

  // Relativistic plasma torus circulation
  if (running && !calm) {
    const circulationSpeed = (powerGj / 3.0) * 8.5;
    plasmaPhase = (plasmaPhase + circulationSpeed * dt) % (2 * Math.PI);
  }

  // Explode spring solver
  let moving = false;
  for (const id of IDS) {
    if (steerSpring(piece[id], dt, calm)) moving = true;
  }

  // Micro-scale quantum magnetic containment vibration
  const shake = running ? 0.2 + (powerGj / 5.0) * 0.25 : 0;
  stage.style.transform = shake > 0.01
    ? `translate(${(Math.sin(clock * 86) * shake * 0.4).toFixed(2)}px, ${(Math.cos(clock * 98) * shake * 0.3).toFixed(2)}px)`

      uApart: piece.bezel ? piece.bezel.x : 0,
      uPower: powerGj,
      uPhase: plasmaPhase,
      uCenter: D.reactorCenter,
      uMajorR: D.majorR,
      uMinorR: D.minorR,
    }, clock);

  frame = visible && active ? requestAnimationFrame(tick) : 0;

    frame = requestAnimationFrame(tick);

  powerSlider.addEventListener("input", (e) => {

    describe();
  });
}

// Keyboard Navigation
stage.addEventListener("keydown", (event) => {
  if (event.key === " " || event.key === "Spacebar") {
    event.preventDefault();
    running = !running;
    updateRunButton();
    run();
  } else if (event.key === "e" || event.key === "E") {
    event.preventDefault();
    setApart(!apart);
  } else if (event.key === "x" || event.key === "X") {
    event.preventDefault();
    setXray(!xray);
  } else if (event.key === "ArrowUp") {
    event.preventDefault();
    powerGj = Math.min(5.0, powerGj + 0.25);
    if (powerSlider) powerSlider.value = powerGj;
    describe();
  } else if (event.key === "ArrowDown") {
    event.preventDefault();
    powerGj = Math.max(0.5, powerGj - 0.25);
    if (powerSlider) powerSlider.value = powerGj;
    describe();
  } else if (event.key === "Escape") {
    selectPart(null);
    if (apart) setApart(false);
    if (xray) setXray(false);
  }
});

updateRunButton();
updateCoilPills();
place();
describe();
if (visible) run();
