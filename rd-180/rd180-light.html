<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>RD-180 Rocket Engine</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;

  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(980px,100% - 32px);margin:64px auto 96px}
</style></head><body class="iso" data-theme="light"><main class="iso-page"><style>.rd {
  --rd-blend: screen;
  --rd-button-hover: #232323;
  --rd-button-ring: #ffffff14;
  --rd-part-ring: #ffffff10;
  --rd-part-hover: #ffffff0a;
  --rd-lamp-off: #4a4a4a;
  --rd-lamp-on: #ff8a3c;
  --rd-lamp-glow: #ff7a2a88;
  --rd-lamp-armed: #ffcf6a;
  --rd-rim: #ffb46e;
  --rd-rim-soft: #ff8a3c;
  --rd-rim-soft-share: 0.45;
  --rd-flash-0: #fff4e6;
  --rd-flash-1: #ffd2a066;
  --rd-flash-2: #ff9a5a22;
  --rd-flash-3: #ff9a5a00;
  --rd-deck-0: #ffcf98;
  --rd-deck-1: #ff8a3abf;
  --rd-deck-2: #b34a1247;
  --rd-deck-3: #5a220800;
  --rd-deck-share: 1;
}

[data-theme="light"] .rd {
  --rd-blend: normal;
  --rd-button-hover: #f0f0ed;
  --rd-button-ring: #0000001a;
  --rd-part-ring: #00000014;
  --rd-part-hover: #0000000a;
  --rd-lamp-off: #c4c4c4;
  --rd-lamp-on: #d9480f;
  --rd-lamp-glow: #d9480f55;
  --rd-lamp-armed: #c99400;
  --rd-rim: #c2410c;
  --rd-rim-soft: #ea580c;
  --rd-rim-soft-share: 0.25;
  --rd-flash-0: #ffd9b0;
  --rd-flash-1: #ffb07a44;
  --rd-flash-2: #ff8a4a14;
  --rd-flash-3: #ff8a4a00;
  --rd-deck-0: #c2410c;
  --rd-deck-1: #ea580c8c;
  --rd-deck-2: #f9731633;
  --rd-deck-3: #f9731600;
  --rd-deck-share: 0.45;
}

.rd .iso-plate {
  padding: 52px 24px 64px;
  overflow: hidden;
}

.rd-stage {
  position: relative;
  border-radius: 10px;
  touch-action: pan-y;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
  will-change: transform;
}

.rd-stage:focus-visible {
  outline: 1px solid var(--anatomy-muted);
  outline-offset: 6px;
}

.rd-stage > svg,
.rd-stage > canvas,
.rd-stage > div {
  display: block;
  width: 100%;
  height: auto;
}

.rd-front,
.rd-plume,
.rd-glow,
.rd-veil,
.rd-flash {
  position: absolute;
  inset: 0;
  height: 100% !important;
}

.rd-plume,
.rd-glow,
.rd-veil,
.rd-flash {
  pointer-events: none;
}

.rd-plume,
.rd-glow,
.rd-veil {
  mix-blend-mode: var(--rd-blend);
}

.rd-glow {
  overflow: visible;
}

.rd-front {
  pointer-events: none;
  overflow: visible;
}

.rd-front .it {
  pointer-events: visiblePainted;
}

.rd-flash {
  opacity: 0;
  mix-blend-mode: var(--rd-blend);
  background: radial-gradient(circle closest-side at 50% 82%, var(--rd-flash-0) 0%, var(--rd-flash-1) 24%, var(--rd-flash-2) 56%, var(--rd-flash-3) 100%);
}

.rd-shadow {
  opacity: 0.45;
}

.tb-body {
  fill: var(--anatomy-shade-2);
  stroke: none;
}

.tb-shine {
  fill: var(--anatomy-top);
  stroke: none;
}

.tb-shade {
  fill: var(--anatomy-shade-0);
  stroke: none;
}

.rd-stage[data-focus] .it:not([data-on]):not([data-piece="stand"]) {
  --anatomy-hi: var(--anatomy-mid);
  --anatomy-mid: var(--anatomy-lo);
}

.rd-stage[data-focus] .it[data-piece="stand"] {
  --anatomy-mid: var(--anatomy-lo);
}

.it[data-on] {
  --anatomy-hi: var(--anatomy-lit);
  --anatomy-mid: var(--anatomy-hi);
}

.it[data-on] .iso-top,
.it[data-on] .tb-shine {
  fill: var(--anatomy-lit-top);
}

.it[data-on] .iso-shade,
.it[data-on] .tb-body {
  fill: var(--anatomy-lit-shade);
}

.it[data-on] [data-seamless] > .iso-shade {
  stroke: var(--anatomy-lit-shade);
}

.it[data-on] [data-seamless] > .iso-top {
  stroke: var(--anatomy-lit-top);
}

.rd-controls {
  position: absolute;
  left: 20px;
  bottom: 16px;
  display: flex;
  align-items: center;
  gap: 14px;
  font-family: var(--anatomy-mono);
  font-size: 10.5px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--anatomy-muted);
}

.rd-fire {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  height: 28px;
  padding: 0 13px 0 11px;
  border: 0;
  border-radius: 999px;
  background: var(--anatomy-face);
  color: var(--anatomy-strong);
  font: inherit;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  cursor: pointer;
  box-shadow: inset 0 0 0 1px var(--rd-button-ring);
  transition: background 200ms var(--anatomy-ease), color 200ms var(--anatomy-ease), transform 160ms var(--anatomy-ease);
}

.rd-fire:hover {
  background: var(--rd-button-hover);
}

.rd-fire:active {
  transform: scale(0.97);
}

.rd-fire:focus-visible {
  outline: 1px solid var(--anatomy-muted);
  outline-offset: 3px;
}

.rd-lamp {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--rd-lamp-off);
  box-shadow: 0 0 0 0 transparent;
  transition: background 240ms var(--anatomy-ease), box-shadow 240ms var(--anatomy-ease);
}

.rd-fire[data-state="on"] .rd-lamp {
  background: var(--rd-lamp-on);
  box-shadow: 0 0 10px 2px var(--rd-lamp-glow);
}

.rd-fire[data-state="armed"] .rd-lamp {
  background: var(--rd-lamp-armed);
  box-shadow: 0 0 8px 1px var(--rd-lamp-glow);
}

.rd-parts {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 6px;
}

.rd-part {
  display: inline-flex;
  align-items: baseline;
  gap: 7px;
  padding: 5px 10px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: var(--anatomy-muted);
  font: 12.5px/1.3 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  cursor: pointer;
  box-shadow: inset 0 0 0 1px var(--rd-part-ring);
  transition: color 160ms var(--anatomy-ease), background 160ms var(--anatomy-ease);
}

.rd-part:hover,
.rd-part:focus-visible,
.rd-part[data-on] {
  color: var(--anatomy-strong);
  background: var(--rd-part-hover);
  outline: none;
}

.rd-num {
  font-family: var(--anatomy-mono);
  font-size: 10px;
  color: var(--anatomy-muted);
}

.rd-rim {
  fill: none;
  stroke: var(--rd-rim);
  stroke-width: 1.6;
  opacity: calc(var(--rim, 0));
}

.rd-rim-soft {
  stroke: var(--rd-rim-soft);
  stroke-width: 4.5;
  opacity: calc(var(--rim, 0) * var(--rd-rim-soft-share));
}

@media (max-width: 640px) {
  .rd .iso-plate {
    padding: 48px 8px 88px;
  }

  .rd .iso-plate-corner[data-corner="readout"] {
    bottom: 46px;
    right: 0;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .rd-stage[data-focus] ~ .rd-controls .rd-hint {
    visibility: hidden;
  }

  .rd-controls {
    left: 14px;
    bottom: 14px;
    gap: 10px;
    max-width: calc(100% - 28px);
    flex-wrap: wrap;
  }

  .rd-hint {
    font-size: 9.5px;
    letter-spacing: 0.06em;
    line-height: 1.3;
  }

rner"><span class="rd-num">03</span>Oxygen-Rich Preburner (ORPB)</button><button type="button" class="rd-part" data-part="turbopump"><span class="rd-num">04</span>180,000 HP Main Turbopump</button><button type="button" class="rd-part" data-part="hotgas_duct"><span class="rd-num">05</span>Bifurcated Hot-Gas Ducts</button><button type="button" class="rd-part" data-part="chamber_a"><span class="rd-num">06</span>Left Combustion Chamber & Nozzle</button><button type="button" class="rd-part" data-part="chamber_b"><span class="rd-num">07</span>Right Combustion Chamber & Nozzle</button><button type="button" class="rd-part" data-part="fuel_plumbing"><span class="rd-num">08</span>RP-1 High-Pressure Plumbing</button><button type="button" class="rd-part" data-part="controller"><span class="rd-num">09</span>Digital ECU & Hydraulic Power Unit</button></div><span class="iso-caption">The NPO Energomash RD-180 is an oxygen-rich staged-combustion rocket engine that powered the Atlas V launcher: liquid oxygen and RP-1 kerosene at 257 bar chamber pressure, generating 390 tf (3.83 MN) of sea-level thrust at 5,480 kg dry mass. A single 180,000 HP (135 MW) turbopump and a single oxygen-rich preburner drive both combustion chambers through a massive insulated bifurcated Y-duct. Four independent hydraulic TVC actuators provide ±8° of pitch, yaw, and roll gimbaling.</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");
    return text === "-0" ? "0" : text;
};
function pathOf(points, closed = false) {
    if (!points.length)
        return "";
    return points.map(([x, y], at) => `${at ? "L" : "M"}${tenth(x)} ${tenth(y)}`).join("") + (closed ? "Z" : "");
}
const joinPaths = (paths) => paths.filter(Boolean).join("");
function roundedPlan({ x, y, w, d, r }, steps = 8) {
    const radius = Math.max(0, Math.min(r, w / 2, d / 2));
    const corners = [
        [x + w - radius, y + radius, -90],
        [x + w - radius, y + d - radius, 0],
        [x + radius, y + d - radius, 90],
        [x + radius, y + radius, 180],
    ];
    const out = [];
    for (const [cx, cy, start] of corners) {
        const count = radius > 0 ? steps : 0;
        for (let step = 0; step <= count; step++) {
            const angle = (start + (count ? (90 * step) / count : 45)) * RADIANS;
            out.push([cx + radius * Math.cos(angle), cy + radius * Math.sin(angle)]);
        }

}
function signedArea(points) {
    let area = 0;
    for (let index = 0; index < points.length; index++) {
        const [ax, ay] = points[index];
        const [bx, by] = points[(index + 1) % points.length];
        area += ax * by - bx * ay;

const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);
function convexHull(points) {
    const sorted = [...points].sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    if (sorted.length < 3)
        return sorted;
    const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    const lower = [];
    for (const point of sorted) {
        while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], point) <= 0)
            lower.pop();
        lower.push(point);
    }
    const upper = [];
    for (let index = sorted.length - 1; index >= 0; index--) {
        const point = sorted[index];
        while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], point) <= 0)

function runsOf(flags, want) {

    let run = null;
    for (let step = 0; step < count; step++) {
        const index = (start + step) % count;
        if (flags[index] === want) {
            if (!run)
                run = [index];
            run.push((index + 1) % count);
        }
        else if (run) {
            runs.push(run);

    if (run)
        runs.push(run);
    return runs;
}
function extrude(ring, z, height, projection, options = {}) {
    const convex = options.convex ?? true;
    const count = ring.length;
    const counter = signedArea(ring) > 0;
    const [vx, vy] = towardViewer(projection);

        for (let index = 0; index < count; index++) {

            const [nx, ny] = normals[index];
            const lit = (nx * lx + ny * ly + 1) / 2;
            const shade = Math.min(SHADES - 1, Math.max(0, Math.floor(lit * SHADES)));
            const next = (index + 1) % count;
            buckets[shade].push(pathOf(oriented([top[index], top[next], bottom[next], bottom[index]]), true));

    }
    let bevel;
    if (options.bevel && options.bevel > 0) {
        const by = options.bevel;

  hue: glide(),
  glowStop: null,
  lastGlow: 0,
  popped: false,
  phase: "",
  pre: glide(),
  vent: glide(),
  smoke: glide(),
  reach: glide(),
  splash: glide(),
  mainAt: -99,
  popAt: -99,
};

function say(text) {
  if (readout.textContent !== text) readout.textContent = text;
}

function describe() {
  const text = selected ? D.pieces[selected].say : burn.on ? "firing · 390 tf" : apart ? "apart · 9 assemblies" : "5,480 kg · cold";
  if (stage.getAttribute("aria-valuetext") !== text) stage.setAttribute("aria-valuetext", text);
}

function setApart(on) {
  if (apart === on) return;
  apart = on;
  const goal = on ? 1 : 0;
  let index = 0;
  for (const id of on ? STAGGER : [...STAGGER].reverse()) {
    if (!piece[id]) continue;
    if (piece[id].target === goal) piece[id].pending = null;
    else piece[id].pending = { value: goal, at: clock + (still.matches ? 0 : index++ * SPRING.stagger) };
  }
  describe();
  run();
}

function select(id) {
  if (id === "stand") id = null;
  if (selected === id) return;
  selected = id;
  for (const node of nodes) {
    if (id !== null && node.piece === id) node.el.setAttribute("data-on", "");
    else node.el.removeAttribute("data-on");
  }
  if (id) stage.setAttribute("data-focus", "");
  else stage.removeAttribute("data-focus");
  partButtons.forEach((button) => (button.dataset.part === id ? button.setAttribute("data-on", "") : button.removeAttribute("data-on")));
  stage.setAttribute("aria-valuenow", String(id ? D.order.indexOf(id) + 1 : 0));
  describe();
}

function steerSpring(state, dt, calm) {
  if (state.pending && clock >= state.pending.at) {
    state.target = state.pending.value;
    state.pending = null;
  }
  if (calm) {
    state.x = state.target;
    state.v = 0;
    return false;
  }
  for (let index = 0; index < SPRING.substeps; index++) {
    const h = dt / SPRING.substeps;
    state.v += ((state.target - state.x) * SPRING.stiffness - state.v * SPRING.damping) * h;
    state.x += state.v * h;
  }
  if (Math.abs(state.target - state.x) < 2e-4 && Math.abs(state.v) < 2e-4) {
    state.x = state.target;
    state.v = 0;
    return state.pending !== null;
  }
  return true;
}

function place() {
  for (const node of nodes) {
    const share = piece[node.ride].x;
    const tx = (D.EX[0] * node.m[0] + D.EY[0] * node.m[1] + D.EZ[0] * node.m[2]) * share;
    const ty = (D.EX[1] * node.m[0] + D.EY[1] * node.m[1] + D.EZ[1] * node.m[2]) * share;
    const text = share === 0 ? "" : `translate(${tx.toFixed(2)} ${ty.toFixed(2)})`;
    if (text !== node.shown) {
      node.shown = text;
      if (text) node.el.setAttribute("transform", text);
      else node.el.removeAttribute("transform");
    }
  }
  const next = nodes.map((_, index) => index).sort((a, b) => nodes[a].key + nodes[a].lift * piece[nodes[a].ride].x - (nodes[b].key + nodes[b].lift * piece[nodes[b].ride].x));
  if (next.some((index, at) => index !== order[at])) {
    const fragment = document.createDocumentFragment();
    for (const index of next) fragment.appendChild(nodes[index].el);
    engine.appendChild(fragment);
    order = next;
  }
  const moved = Math.abs(jitter[0]) > 0.005 || Math.abs(jitter[1]) > 0.005;
  const shift = moved ? `translate(${jitter[0].toFixed(2)} ${jitter[1].toFixed(2)})` : "";
  engine.setAttribute("transform", shift);
  if (glowGroup) glowGroup.setAttribute("transform", shift);
}

// Dual Plume WebGL Shader
const COMMON = `
uniform vec2 uJit;
uniform float uPc;
uniform float uHue;
uniform float uSmoke;
uniform float uVent;
uniform float uShockR;
uniform float uShockA;
uniform float uLight;
const float ZE = ${D.zExit.toFixed(1)};
const float R0 = ${D.exitR.toFixed(1)};
const float PL = ${D.plumeLength.toFixed(1)};
const vec2 EXIT_A = vec2(${D.exitA[0].toFixed(1)}, ${D.exitA[1].toFixed(1)});
const vec2 EXIT_B = vec2(${D.exitB[0].toFixed(1)}, ${D.exitB[1].toFixed(1)});

float noise(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453);}
float fbm(vec2 p){float v=0.;float a=.5;for(int i=0;i<3;i++){v+=a*noise(p);p*=2.02;a*=.5;}return v;}

vec4 inkOf(vec3 col){
  float a=clamp(max(col.r,max(col.g,col.b)),0.,1.);
  return vec4(col,a);
}
`;

const PLUME = `${COMMON}
uniform float uGlow;
uniform float uPre;
uniform float uReach;
uniform float uSplash;
uniform float uFlash;
uniform float uRingR;
uniform float uRingA;
uniform float uPop;
uniform float uPopR;

void main(){
  vec2 uv = gl_FragCoord.xy / vec2(${D.W.toFixed(1)}, ${D.H.toFixed(1)});
  vec2 pWorld = viewOf(gl_FragCoord.xy);
  
  // Dual chamber centers in screen space
  vec2 pA = pWorld - vec2(${D.screenExitA[0].toFixed(1)}, ${D.screenExitA[1].toFixed(1)});
  vec2 pB = pWorld - vec2(${D.screenExitB[0].toFixed(1)}, ${D.screenExitB[1].toFixed(1)});
  
  float dA = length(pA);
  float dB = length(pB);
  
  vec3 col = vec3(0.0);
  float pf = clamp(uPc, 0.0, 1.0);
  
  if (pf > 0.001 || uPre > 0.001) {
    // Jet core for Nozzle A
    float yA = pA.y;
    float xA = pA.x;
    if (yA > 0.0 && yA < uReach) {
      float wA = R0 * (0.8 + 0.3 * (yA / uReach));
      float rA = abs(xA) / wA;
      if (rA < 1.4) {
        float coreA = exp(-rA * rA * 3.0) * (1.0 - yA / uReach);
        // Supersonic kerosene-LOX rich flame: intense white-yellow core with golden amber edges
        vec3 flameA = mix(vec3(1.0, 0.95, 0.8), vec3(1.0, 0.55, 0.12), rA);
        // Shock diamonds
        float shockA = sin(yA * 0.18 - uTime * 35.0) * 0.5 + 0.5;
        col += flameA * coreA * (1.2 + 0.8 * shockA) * pf;
      }
    }
    
    // Jet core for Nozzle B
    float yB = pB.y;
    float xB = pB.x;
    if (yB > 0.0 && yB < uReach) {
      float wB = R0 * (0.8 + 0.3 * (yB / uReach));
      float rB = abs(xB) / wB;
      if (rB < 1.4) {
        float coreB = exp(-rB * rB * 3.0) * (1.0 - yB / uReach);
        vec3 flameB = mix(vec3(1.0, 0.95, 0.8), vec3(1.0, 0.55, 0.12), rB);
        float shockB = sin(yB * 0.18 - uTime * 35.0 + 1.2) * 0.5 + 0.5;
        col += flameB * coreB * (1.2 + 0.8 * shockB) * pf;
      }
    }
    
    // Deluge splash on the deck
    if (uSplash > 0.01) {
      float deckDistA = length(pA - vec2(0.0, PL));
      float deckDistB = length(pB - vec2(0.0, PL));
      float splashA = exp(-pow(deckDistA / 70.0, 1.8)) * uSplash;
      float splashB = exp(-pow(deckDistB / 70.0, 1.8)) * uSplash;
      vec3 splashCol = vec3(1.0, 0.65, 0.25);
      col += splashCol * (splashA + splashB) * 0.7;
    }
    
    // Flash & thermal illumination
    col += vec3(1.0, 0.8, 0.5) * uFlash * exp(-min(dA, dB) / 120.0);
  }
  
  gl_FragColor = inkOf(col);
}
`;

const layer = glLayer({
  canvas,
  fragment: PLUME,
  view: [D.W, D.H],
  camera: D.camera,
  uniforms: ["uJit", "uPc", "uHue", "uSmoke", "uVent", "uShockR", "uShockA", "uLight", "uGlow", "uPre", "uReach", "uSplash", "uFlash", "uRingR", "uRingA", "uPop", "uPopR"],
});
if (layer) stage.setAttribute("data-gl", "");
const LIGHT = document.body.dataset.theme === "light" || root.closest('[data-theme="light"]') ? 1 : 0;

let lastKey = "";
function paintPlume(values, active) {
  if (!layer) return;
  if (!active) {
    layer.clear();
    lastKey = "";
    return;
  }
  const time = still.matches ? 0.8 : clock;
  const key = still.matches ? JSON.stringify(values) : "";
  if (key && key === lastKey) return;
  lastKey = key;
  layer.draw(values, time);
}

function announce(phase) {
  if (burn.phase === phase) return;
  burn.phase = phase;
  if (live) live.textContent = phase;
}

function fireState(state) {
  if (state) fireButton.dataset.state = state;
  else delete fireButton.dataset.state;
}

function ignite(fromTour = false) {
  if (burn.on) return;
  setApart(false);
  select(null);
  burn.on = true;
  describe();
  burn.armed = true;
  burn.tour = fromTour;
  burn.t = 0;
  burn.stopping = -1;
  burn.glowStop = null;
  burn.popped = false;
  burn.stopAt = fromTour ? MAIN + 4.2 : MAIN + STEADY;
  fireState("armed");
  fireLabel.textContent = "Shut down";
  run();
}

function shutdown() {
  if (!burn.on || burn.stopping >= 0) return;
  burn.stopping = burn.t;
}

function pcTarget() {
  if (!burn.on || burn.armed || burn.stopping >= 0) return 0;
  if (burn.t >= MAIN) return 1;
  if (burn.t >= VENT) return PREBURNER_PC;
  return 0;
}

function stepBurn(dt, calm) {
  if (burn.on && burn.armed && IDS.every((id) => piece[id].x < 0.002 && !piece[id].pending)) {
    burn.armed = false;
    fireState("on");
    if (calm) burn.t = MAIN + 0.5;
  }
  const before = burn.t;
  if (burn.on && !burn.armed) burn.t += dt;
  const t = burn.t;
  if (burn.on && burn.stopping < 0 && t >= burn.stopAt) burn.stopping = t;
  const lit = burn.on && !burn.armed && burn.stopping < 0;
  if (lit && t >= MAIN && before < MAIN && !calm) burn.mainAt = clock;
  const target = pcTarget();
  if (calm) {
    burn.pc = target;
    burn.pcRate = 0;
  } else {
    const falling = burn.stopping >= 0;
    const stiff = falling ? 16 : target > PREBURNER_PC ? 20 : 64;
    const drag = falling ? 8.2 : 2 * Math.sqrt(stiff);
    for (let index = 0; index < 4; index++) {
      const h = dt / 4;
      burn.pcRate += ((target - burn.pc) * stiff - burn.pcRate * drag) * h;
      burn.pc = clamp(burn.pc + burn.pcRate * h, 0, 1);
    }
  }
  settle(burn.hue, lit && burn.pc > 0.2 ? 1 : 0, dt, lit ? 0.32 : 0.5, calm);
  const onset = smooth(0, 0.1, burn.pc);
  let glow = onset * (1.15 - 0.15 * burn.hue.x);
  if (!burn.on) glow = 0;
  burn.lastGlow = glow;
  settle(burn.pre, lit && t > VENT && t < MAIN + 0.1 ? 1 : 0, dt, lit && t < MAIN ? 0.06 : 0.12, calm);
  settle(burn.vent, lit && t < MAIN ? 1 : 0, dt, lit && t < MAIN ? 0.16 : 0.24, calm);
  settle(burn.reach, 80 * smooth(0, 0.12, burn.pc) + (LONGEST - 80) * smooth(0.16, 0.75, burn.pc), dt, burn.stopping >= 0 ? 0.12 : 0.07, calm);
  settle(burn.splash, smooth(0.35, 0.9, burn.pc) * smooth(D.plumeLength - 10, D.plumeLength + 40, burn.reach.x), dt, 0.16, calm);
  settle(burn.smoke, lit && t > MAIN + 0.4 ? 1 : 0, dt, lit ? 0.9 : 1.8, calm);
  if (burn.on && burn.stopping >= 0 && burn.pc < 0.2 && !burn.popped && !calm) {
    burn.popAt = clock;
    burn.popped = true;
  }
  if (burn.on && burn.stopping >= 0 && burn.pc < 0.003 && Math.abs(burn.pcRate) < 0.01 && t - burn.stopping > 0.9) {
    burn.on = false;
    burn.t = -1;
    burn.pc = 0;
    burn.pcRate = 0;
    burn.glowStop = null;
    fireState("");
    fireLabel.textContent = "Ignite";
    announce("cold");
    describe();
    if (burn.tour) tourClock = 0;
  }

  const sinceMain = clock - burn.mainAt;
  const sincePop = burn.popAt >= 0 ? clock - burn.popAt : -1;
  const flash = calm ? 0 : burst(sinceMain, 0.08, 0.13);
  const shockA = calm ? 0 : burst(sinceMain, 0.05, 0.12);
  const ringA = calm ? 0 : burst(sinceMain - 0.08, 0.08, 0.16);
  const pop = calm || sincePop < 0 ? 0 : burst(sincePop, 0.09, 0.2);
  const shake = calm ? 0 : 3.8 * burst(sinceMain, 0.05, 0.12);
  const hum = calm ? 0 : 0.4 * burn.pc * smooth(0.02, 0.12, burn.pc);
  jitter = [Math.sin(clock * 89) * hum + Math.sin(clock * 51) * shake, Math.cos(clock * 73) * hum * 0.7 + Math.cos(clock * 59) * shake];

  const values = {
    uJit: jitter,
    uPc: burn.pc,
    uHue: burn.hue.x,
    uGlow: glow,
    uLight: LIGHT,
    uPre: burn.pre.x,
    uVent: burn.vent.x,
    uSmoke: burn.smoke.x,
    uReach: burn.reach.x,
    uSplash: burn.splash.x,
    uFlash: flash,
    uShockR: 26 + 900 * Math.max(0, sinceMain),
    uShockA: shockA,
    uRingR: 600 * Math.max(0, sinceMain - 0.08),
    uRingA: ringA,
    uPop: pop,
    uPopR: 24 + 70 * (1 - Math.exp(-Math.max(0, sincePop) / 0.25)),
  };
  const active = burn.pc > 1e-3 || burn.pre.x > 1e-3 || burn.vent.x > 1e-3 || burn.smoke.x > 1e-3 || flash > 1e-3 || shockA > 1e-3 || ringA > 1e-3 || pop > 1e-3 || (sinceMain > 0 && sinceMain < 0.6);
  paintPlume(values, active);

  const rim = clamp(burn.pc * 0.88 + burn.pre.x * 0.45 * smooth(0, 0.05, burn.pc) + flash * 0.6 + pop * 0.7, 0, 1);
  stage.style.setProperty("--rim", rim.toFixed(3));
  stage.style.setProperty("--deck-glow", clamp(burn.pc * 0.9 * burn.splash.x + flash * 0.5 + burn.pre.x * 0.12 * smooth(0, 0.05, burn.pc) + pop * 0.25, 0, 1).toFixed(3));
  if (flashVeil) flashVeil.style.opacity = (flash * 0.32).toFixed(3);
  stage.style.transform = shake > 0.01 ? `translate(${(Math.sin(clock * 47) * shake * 0.5).toFixed(2)}px, ${(Math.cos(clock * 59) * shake * 0.5).toFixed(2)}px)` : "";

  if (burn.on) {
    const bar = fmt(burn.pc * D.chamberBar);
    const thrust = fmt(Math.max(0, D.vacuumTf * burn.pc - D.backTf));
    if (burn.armed) {
      say("closing up · arming");
      announce("arming");
    } else if (burn.stopping >= 0) {
      say(burn.pc > 0.01 ? `shutdown · ${bar} bar` : "shutdown · purging");
      announce("shutdown");
    } else if (t < VENT) {
      say("chill-down · LOX venting");
      announce("chill-down, LOX venting");
    } else if (t < MAIN) {
      say(`preburner lit · TEA-TEB · ${bar} bar`);
      announce("preburner lit");
    } else {
      say(`Pc ${bar} bar · ${thrust} tf · dual chambers`);
      announce("main stage");
    }
  }
  return burn.on || active;
}

function run() {
  if (frame) return;
  last = performance.now();
  frame = requestAnimationFrame(loop);
}

function loop(now) {
  frame = 0;
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  clock += dt;

  let moving = false;
  for (const id of IDS) {
    if (steerSpring(piece[id], dt, still.matches)) moving = true;
  }
  place();

  const burning = stepBurn(dt, still.matches);
  if (!burn.on && !moving) say(selected ? D.pieces[selected].say : apart ? "apart · 9 assemblies" : "5,480 kg · cold");

  if (moving || burning || burn.on) run();
}

// Event Listeners
stage.addEventListener("mouseenter", () => {
  inside = true;
  clearTimeout(leaveTimer);
  setApart(true);
});

stage.addEventListener("mouseleave", () => {
  inside = false;
  leaveTimer = setTimeout(() => {
    if (!burn.on) setApart(false);
  }, 400);
});

fireButton.addEventListener("click", () => {
  if (burn.on) shutdown();
  else ignite();
});

partButtons.forEach((button) => {
  button.addEventListener("click", () => {
    const part = button.dataset.part;
    if (selected === part) select(null);
    else select(part);
  });
});

window.addEventListener("keydown", (e) => {
  if (e.key === "i" || e.key === "I") {
    if (burn.on) shutdown();
    else ignite();
  } else if (e.key === "Escape") {
    select(null);
    setApart(false);
  }
});

run();
</script></body></html>
