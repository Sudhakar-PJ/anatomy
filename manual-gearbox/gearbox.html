<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Manual Gearbox — Anatomy</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(980px,100% - 32px);margin:64px auto 96px}
</style></head><body class="iso" data-theme="dark"><main class="iso-page"><style>.gearbox {
  --gb-blend: screen;
  --gb-button-hover: #1e2229;
  --gb-button-ring: rgba(255, 255, 255, 0.12);
  --gb-part-ring: rgba(255, 255, 255, 0.1);
  --gb-part-hover: rgba(255, 255, 255, 0.06);
  --gb-lamp-off: #475569;
  --gb-lamp-on: #10b981;
  --gb-lamp-glow: rgba(16, 185, 129, 0.6);
  --gb-power: #ff5500;
  --gb-power-glow: rgba(255, 85, 0, 0.35);
  --gb-synchro: #f59e0b;
  --gb-synchro-glow: rgba(245, 158, 11, 0.3);
  --gb-clutch: #38bdf8;
  --gb-clutch-glow: rgba(56, 189, 248, 0.25);
}

[data-theme="light"] .gearbox {
  --gb-blend: normal;
  --gb-button-hover: #f1f5f9;
  --gb-button-ring: rgba(0, 0, 0, 0.12);
  --gb-part-ring: rgba(0, 0, 0, 0.1);
  --gb-part-hover: rgba(0, 0, 0, 0.05);
  --gb-lamp-off: #94a3b8;
  --gb-lamp-on: #059669;
  --gb-lamp-glow: rgba(5, 150, 105, 0.35);
  --gb-power: #d93800;
  --gb-power-glow: rgba(217, 56, 0, 0.2);
  --gb-synchro: #d97706;
  --gb-synchro-glow: rgba(217, 119, 6, 0.18);
  --gb-clutch: #0284c7;
  --gb-clutch-glow: rgba(2, 132, 199, 0.15);
}

.gearbox .iso-plate {
  padding: 48px 24px 60px;
  overflow: hidden;
  position: relative;
}

.gearbox-stage {
  position: relative;
  border-radius: 8px;
  touch-action: pan-y;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
  cursor: grab;
}

.gearbox-stage:active {
  cursor: grabbing;
}

.gearbox-stage:focus-visible {
  outline: 1px solid var(--anatomy-mid);
  outline-offset: 4px;
}

.gearbox-stage > svg,
.gearbox-stage > canvas {
  display: block;
  width: 100%;
  height: auto;
}

.gearbox-front,
.gearbox-flow-canvas {
  position: absolute;
  inset: 0;
  height: 100% !important;
}

.gearbox-flow-canvas {
  pointer-events: none;
  mix-blend-mode: var(--gb-blend);
}

.gearbox-front {
  pointer-events: none;
}

.gearbox-front .it {
  pointer-events: visiblePainted;
  transition: opacity 160ms cubic-bezier(0.2, 0, 0, 1);
}

.gearbox-stage[data-focus] .gearbox-front .it:not([data-on]) {
  opacity: 0.14;
}

.gearbox-stage[data-focus] .gearbox-front .it[data-on] {
  opacity: 1;
}

/* X-Ray Mode: Dims outer casing to reveal spinning gear mesh, dog teeth & synchros */
.gearbox-stage[data-xray] .gearbox-front .it[data-piece="case_upper"],
.gearbox-stage[data-xray] .gearbox-front .it[data-piece="case_lower"],
.gearbox-stage[data-xray] .gearbox-front .it[data-piece="bellhousing"],
.gearbox-stage[data-xray] .gearbox-front .it[data-piece="tail_housing"],
.gearbox-stage[data-xray] .gearbox-front .it[data-piece="stand"] {
  opacity: 0.15;
}

.gearbox-stage[data-xray] .gearbox-front .it[data-piece="gears_speed"],
.gearbox-stage[data-xray] .gearbox-front .it[data-piece="countershaft"],
.gearbox-stage[data-xray] .gearbox-front .it[data-piece="mainshaft"],
.gearbox-stage[data-xray] .gearbox-front .it[data-piece="synchros"],
.gearbox-stage[data-xray] .gearbox-front .it[data-piece="input_shaft"] {
  opacity: 1 !important;
  filter: drop-shadow(0 0 8px rgba(255, 130, 20, 0.7));
}

/* Controls Bar */
.gearbox-controls {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  margin-top: 16px;
  font-family: var(--anatomy-mono);
  font-size: 11px;
}

.gearbox-btn-group {
  display: inline-flex;
  gap: 6px;
}

.gearbox-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  height: 32px;
  padding: 0 14px;
  border: 1px solid var(--anatomy-mid);
  border-radius: 4px;
  background: var(--anatomy-card);
  color: var(--anatomy-text);
  font-family: inherit;
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  cursor: pointer;
  transition: background 120ms ease, border-color 120ms ease, box-shadow 120ms ease;
}

.gearbox-btn:hover {
  background: var(--gb-button-hover);
  border-color: var(--anatomy-hi);
}

.gearbox-lamp {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--gb-lamp-off);
  box-shadow: none;
  transition: background 150ms ease, box-shadow 150ms ease;
}

.gearbox-btn[data-active] .gearbox-lamp {
  background: var(--gb-lamp-on);
  box-shadow: 0 0 8px var(--gb-lamp-glow);
}

.gearbox-btn[data-clutch-active] {
  border-color: var(--gb-clutch);
  background: var(--gb-clutch-glow);
  color: var(--anatomy-lit);
}

.gearbox-hint {
  color: var(--anatomy-muted);
  letter-spacing: 0.03em;
  text-transform: uppercase;
  font-size: 10.5px;
}

.gearbox-live {
  margin-left: auto;
  color: var(--anatomy-hi);
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.04em;
  font-weight: 500;
}

/* Interactive H-Gate Shift Console */
.gearbox-console {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  margin: 14px 0 12px;
  padding: 12px 18px;
  border: 1px solid var(--anatomy-mid);
  border-radius: 6px;
  background: var(--anatomy-card);
  font-family: var(--anatomy-mono);
}

.gearbox-hgate-wrap {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.gearbox-gate-label {
  font-size: 9.5px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--anatomy-muted);
}

.gearbox-hgate {
  display: flex;
  gap: 6px;
}

.gearbox-shift-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 44px;
  height: 40px;
  border: 1px solid var(--anatomy-mid);
  border-radius: 4px;
  background: transparent;
  color: var(--anatomy-muted);
  cursor: pointer;
  transition: background 120ms, border-color 120ms, color 120ms, box-shadow 120ms;
}

.gearbox-shift-btn:hover {
  border-color: var(--anatomy-hi);
  color: var(--anatomy-text);
  background: var(--gb-part-hover);
}

.gearbox-shift-btn[data-active] {
  border-color: var(--gb-power);
  background: var(--gb-power-glow);
  color: var(--anatomy-lit);
  box-shadow: 0 0 10px var(--gb-power-glow);
}

.gearbox-shift-name {
  font-weight: 700;
  font-size: 12px;
}

.gearbox-shift-ratio {
  font-size: 8.5px;
  opacity: 0.8;
}

/* Gear Status & Telemetry Card */
.gearbox-telemetry {
  display: flex;
  gap: 20px;
  font-size: 11px;
}

.gearbox-telem-item {
  display: flex;
  flex-direction: column;
}

.gearbox-telem-label {
  font-size: 9px;
  color: var(--anatomy-muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.gearbox-telem-val {
  font-weight: 600;
  color: var(--anatomy-text);
  font-variant-numeric: tabular-nums;
  margin-top: 2px;
}

/* RPM Throttle Slider */
.gearbox-rpm-bar {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 10px 0 12px;
  font-family: var(--anatomy-mono);
  font-size: 10.5px;
  color: var(--anatomy-muted);
}

.gearbox-rpm-slider {
  flex: 1;
  -webkit-appearance: none;
  appearance: none;
  height: 4px;
  border-radius: 2px;
  background: var(--anatomy-mid);
  outline: none;
  cursor: pointer;
}

.gearbox-rpm-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--anatomy-lit);
  cursor: grab;
  box-shadow: 0 0 6px rgba(0, 0, 0, 0.4);
}

.gearbox-rpm-slider::-moz-range-thumb {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--anatomy-lit);
  cursor: grab;
  border: none;
}

/* Parts Buttons Grid */
.gearbox-parts {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin: 12px 0 10px;
}

.gearbox-part-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 25px;
  padding: 0 10px;
  border: 1px solid var(--gb-part-ring);
  border-radius: 3px;
  background: transparent;
  color: var(--anatomy-muted);
  font-family: var(--anatomy-mono);
  font-size: 10.5px;
  cursor: pointer;
  transition: color 120ms, border-color 120ms, background 120ms;
}

.gearbox-part-btn:hover {
  color: var(--anatomy-text);
  background: var(--gb-part-hover);
  border-color: var(--anatomy-mid);
}

.gearbox-part-btn[data-on] {
  color: var(--anatomy-text);
  background: var(--gb-button-hover);
  border-color: var(--anatomy-hi);
}

.gearbox-part-num {
  opacity: 0.5;
  font-size: 9px;
}

@media (max-width: 768px) {
  .gearbox .iso-plate {
    padding: 44px 12px 60px;
  }
  .gearbox-controls {
    flex-direction: column;
    align-items: stretch;
    gap: 10px;
  }
  .gearbox-console {
    flex-direction: column;
    align-items: stretch;
  }
  .gearbox-hgate {
    justify-content: space-between;
  }
  .gearbox-telemetry {
    justify-content: space-between;
  }
}

    <span class="iso-caption">A 5-speed constant-mesh synchromesh manual transmission on an instrumented test stand. Torque from the engine enters through the clutch disc into the input shaft, which permanently drives the parallel cluster countershaft (layshaft). Freewheeling speed gears ride on needle bearings on the central mainshaft in constant mesh with the countershaft gears. When shifting (1st–5th, R), the shift fork slides a synchronizer sleeve axially; the brass baulk ring's friction cone synchronizes the gear's rotational speed to the mainshaft before dog teeth lock into positive engagement. In 4th gear, the sleeve locks directly to the input shaft for 1:1 direct drive with zero countershaft torque loss; 5th gear provides 0.75:1 overdrive; Reverse utilizes an intermediate spur idler to invert shaft rotation.</span>

  }

  // Explode spring solver
  let moving = false;
  for (const id of IDS) {
    if (steerSpring(piece[id], dt, calm)) moving = true;
  }

  // Engine dyno vibration
  const shake = running ? 0.15 + (inputRpm / 6000) * 0.2 : 0;
  stage.style.transform = shake > 0.01
    ? `translate(${(Math.sin(clock * 74) * shake * 0.4).toFixed(2)}px, ${(Math.cos(clock * 88) * shake * 0.3).toFixed(2)}px)`
    : "";

  // Update rotating tooth dots on all gears
  updateRotatingGears();

  // Update axial sleeve positions and explode
  place();

  // Render WebGL torque flow shader
  if (glContext && (running || moving)) {
    glContext.draw({
      uRunning: running ? 1.0 : 0.0,
      uClutch: clutchFriction,
      uGearIndex: GEAR_INDICES[currentGear] || 0,
      uInputShaft: D.torqueRoutes.input,
      uCounterShaft: D.torqueRoutes.counter,
      uMainShaft: D.torqueRoutes.output,
      uActiveGearMesh: getActiveMeshPoint(currentGear),
    }, clock);
  }

  describe();

  const active = running || moving;
  frame = visible && active ? requestAnimationFrame(tick) : 0;
}

const run = () => {
  if (!frame && visible) {
    lastTime = 0;
    frame = requestAnimationFrame(tick);
  }
};

new IntersectionObserver((entries) => {
  visible = entries[entries.length - 1].isIntersecting;
  if (visible) run();
}, { rootMargin: "120px 0px" }).observe(stage);

function updateRunButton() {
  runBtn.toggleAttribute("data-active", running);
  const label = runBtn.querySelector("[data-run-label]");
  if (label) label.textContent = running ? "Pause Motor" : "Run Motor";
}

// Control Buttons
runBtn.addEventListener("click", () => {
  running = !running;
  updateRunButton();
  run();
});

apartBtn.addEventListener("click", () => {
  setApart(!apart);
});

if (xrayBtn) {
  xrayBtn.addEventListener("click", () => {
    setXray(!xray);
  });
}

if (clutchBtn) {
  clutchBtn.addEventListener("click", () => {
    setClutch(!clutchDisengaged);
  });
}

partBtns.forEach((btn) => {
  btn.addEventListener("click", () => selectPart(btn.dataset.part));
});

shiftBtns.forEach((btn) => {
  btn.addEventListener("click", () => {
    setGear(btn.dataset.gear);
  });
});

if (rpmSlider) {
  rpmSlider.addEventListener("input", (e) => {
    inputRpm = Number(e.target.value);
    describe();
  });
}

// Keyboard Navigation
stage.addEventListener("keydown", (event) => {
  if (event.key === " " || event.key === "Spacebar") {
    event.preventDefault();
    running = !running;
    updateRunButton();
    run();
  } else if (event.key === "c" || event.key === "C") {
    event.preventDefault();
    setClutch(!clutchDisengaged);
  } else if (event.key === "e" || event.key === "E") {
    event.preventDefault();
    setApart(!apart);
  } else if (event.key === "x" || event.key === "X") {
    event.preventDefault();
    setXray(!xray);
  } else if (["1", "2", "3", "4", "5"].includes(event.key)) {
    event.preventDefault();
    setGear(event.key);
  } else if (event.key === "r" || event.key === "R") {
    event.preventDefault();
    setGear("R");
  } else if (event.key === "n" || event.key === "N") {
    event.preventDefault();
    setGear("N");
  } else if (event.key === "Escape") {
    selectPart(null);
    if (apart) setApart(false);
    if (xray) setXray(false);
  }
});

updateRunButton();
setGear(currentGear);
updateRotatingGears();
place();
describe();
if (visible) run();
</script></body></html>
