  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;

  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}

.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}

.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}

.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}

@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}

.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}

.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}

.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}

@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}

*{box-sizing:border-box}

  --bk-accent: #38bdf8;
  --bk-accent-glow: rgba(56, 189, 248, 0.4);
  --bk-lamp-off: #475569;

  --bk-wind-color: #a78bfa;

[data-theme="light"] .bk {
  --bk-accent: #0284c7;
  --bk-accent-glow: rgba(2, 132, 199, 0.3);
  --bk-lamp-off: #94a3b8;
  --bk-lamp-on: #0284c7;
  --bk-lamp-glow: rgba(2, 132, 199, 0.4);
  --bk-core-color: #d97706;
  --bk-crane-color: #dc2626;
  --bk-glass-color: #0284c7;
  --bk-wind-color: #7c3aed;
  --bk-steel-color: #475569;
  --bk-concrete-color: #64748b;
  --bk-btn-bg: rgba(0, 0, 0, 0.03);
  --bk-btn-hover: rgba(0, 0, 0, 0.06);
  --bk-btn-active: rgba(2, 132, 199, 0.12);
  --bk-ring: rgba(0, 0, 0, 0.1);
  --bk-tele-bg: rgba(248, 250, 252, 0.9);
  --bk-tele-border: rgba(0, 0, 0, 0.08);
  --bk-tele-label: #64748b;
  --bk-tele-val: #0f172a;
}

.bk .iso-plate {
  padding: 44px 20px 48px;
  overflow: hidden;
  position: relative;
}

.bk-stage {
  position: relative;
  border-radius: 8px;
  touch-action: pan-y;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
  cursor: grab;
  margin: 0 auto;
}

.bk-stage:active {
  cursor: grabbing;
}

.bk-stage:focus-visible {
  outline: 1px solid var(--anatomy-mid, #64748b);
  outline-offset: 4px;
}

.bk-stage > svg,
.bk-stage > canvas {
  display: block;
  width: 100%;
  height: auto;
}

.bk-front,
.bk-wind-layer {
  position: absolute;
  inset: 0;
  height: 100% !important;
  pointer-events: none;
}

.bk-front .it {
  pointer-events: visiblePainted;
  transition: opacity 180ms cubic-bezier(0.2, 0, 0, 1), transform 80ms linear;
}

.bk-stage[data-focus] .bk-front .it:not([data-on]) {
  opacity: 0.15;
}

.bk-stage[data-focus] .bk-front .it[data-on] {
  opacity: 1;
}

/* Structural X-Ray Mode: Glass fades to reveal hexagonal core & outriggers */
.bk-stage[data-xray-active] .it[data-kind="glass"] {
  opacity: 0.12 !important;
}

.bk-stage[data-xray-active] .it[data-kind="core"],
.bk-stage[data-xray-active] .it[data-kind="outrigger"] {
  stroke: var(--bk-core-color) !important;
  stroke-width: 1.1px;
}

/* Equipment mode: Highlights Cranes & Concrete Pump Lines */
.bk-stage[data-cranes-active] .it[data-kind="crane"],
.bk-stage[data-cranes-active] .it[data-kind="pump"] {
  stroke: var(--bk-crane-color) !important;
  stroke-width: 1.3px;
  filter: drop-shadow(0 0 3px var(--bk-crane-color));
}

/* Aerodynamic Wind Flow Lines */
.bk-wind-layer {
  opacity: 0;
  transition: opacity 280ms ease;
  pointer-events: none;
}

.bk-stage[data-wind-active] .bk-wind-layer {
  opacity: 1;
}

.bk-wind-path {
  fill: none;
  stroke: var(--bk-wind-color);
  stroke-width: 1.2px;
  stroke-dasharray: 6 12;
  animation: bkWiring 1.8s linear infinite;
  opacity: 0.75;
}

@keyframes bkWiring {
  from { stroke-dashoffset: 72; }
  to { stroke-dashoffset: 0; }
}

/* Controls Header and Bar */
.bk-controls {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-top: 18px;
  position: relative;
  z-index: 10;
}

.bk-btn-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.bk-btn-group {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--bk-btn-bg);
  padding: 4px;
  border-radius: 6px;
  border: 1px solid var(--bk-ring);
}

.bk-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: transparent;
  border: 1px solid transparent;
  color: inherit;
  font-family: inherit;
  font-size: 11px;
  font-weight: 500;
  padding: 5px 9px;
  border-radius: 4px;
  cursor: pointer;
  transition: all 140ms ease;
  user-select: none;
}

.bk-btn:hover {
  background: var(--bk-btn-hover);
  border-color: var(--bk-ring);
}

.bk-btn[data-active] {
  background: var(--bk-btn-active);
  border-color: var(--bk-accent);
  color: var(--bk-accent);
}

.bk-lamp {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--bk-lamp-off);
  transition: all 180ms ease;
}

.bk-btn[data-active] .bk-lamp {
  background: var(--bk-lamp-on);
  box-shadow: 0 0 7px var(--bk-lamp-glow);
}

/* Telemetry HUD Panel */
.bk-tele-strip {
  display: grid;
  grid-template-columns: 1.2fr 0.8fr 1.3fr 1.0fr 1.0fr 1.0fr 1.1fr;
  gap: 10px;
  background: var(--bk-tele-bg);

  backdrop-filter: blur(8px);
  border-radius: 8px;
  padding: 10px 14px;
  margin-top: 8px;
}

.bk-tele-item {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}

.bk-tele-lbl {
  font-size: 9px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--bk-tele-label);
  white-space: nowrap;
}

.bk-tele-val {
  font-size: 13px;
  font-weight: 600;
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  color: var(--bk-tele-val);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.bk-tele-val small {
  font-size: 10px;
  font-weight: 400;
  color: var(--bk-tele-label);
  margin-left: 2px;
}

/* Timeline & Scrubbing Slider */
.bk-scrub-box {
  display: flex;
  flex-direction: column;
  gap: 6px;
  background: var(--bk-btn-bg);
  border: 1px solid var(--bk-ring);
  border-radius: 6px;
  padding: 8px 12px;
  margin-top: 6px;
}

.bk-scrub-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--bk-tele-label);
}

.bk-scrub-active-phase {
  color: var(--bk-accent);
  font-weight: 700;
}

.bk-slider {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 6px;
  background: rgba(100, 116, 139, 0.25);
  border-radius: 3px;
  outline: none;
  cursor: pointer;
  transition: background 150ms ease;
}

.bk-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: var(--bk-accent);

  border: 2px solid #fff;
  transition: transform 120ms ease;
}

.bk-slider::-webkit-slider-thumb:hover {

}

.bk-slider::-moz-range-thumb {
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: var(--bk-accent);
  box-shadow: 0 0 8px var(--bk-accent-glow);
  cursor: pointer;
  border: 2px solid #fff;
  transition: transform 120ms ease;
}

/* Phase Pills Container: 3x3 balanced grid */
.bk-phase-strip {
  display: grid;

  gap: 8px;
  margin: 12px 0 8px;
}

.bk-phase-pill {

  background: var(--bk-btn-bg);
  border: 1px solid var(--bk-ring);

  cursor: pointer;
  text-align: left;
  transition: all 140ms ease;
}

.bk-phase-pill:hover {

  border-color: var(--bk-accent);
}

.bk-phase-pill[data-active] {
  background: var(--bk-btn-active);
  border-color: var(--bk-accent);
}

.bk-phase-num {
  font-size: 9px;

  text-transform: uppercase;
  color: var(--bk-accent);
  letter-spacing: 0.03em;
}

.bk-phase-name {
  font-size: 11px;
  font-weight: 600;
  color: var(--bk-tele-val);
  margin-top: 2px;
  line-height: 1.2;
}

.bk-phase-sub {
  font-size: 9px;
  color: var(--bk-tele-label);
  margin-top: 2px;
}

/* Parts / Inspection Buttons */
.bk-parts-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 6px;
  margin: 12px 0;
}

.bk-part-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--bk-btn-bg);
  border: 1px solid var(--bk-ring);
  padding: 6px 10px;
  border-radius: 5px;
  cursor: pointer;
  font-size: 11px;
  font-family: inherit;
  color: inherit;
  text-align: left;
  transition: all 140ms ease;
}

.bk-part-btn:hover {
  background: var(--bk-btn-hover);
  border-color: var(--bk-accent);
}

.bk-part-btn[data-active] {
  background: var(--bk-btn-active);
  border-color: var(--bk-accent);
  color: var(--bk-accent);
}

.bk-part-num {
  font-family: ui-monospace, SFMono-Regular, monospace;
  font-size: 10px;
  font-weight: 700;

}

.bk-part-btn[data-active] .bk-part-num {
  color: var(--bk-accent);
}

.bk-hint {
  font-size: 10px;
  color: var(--bk-tele-label);
  margin-top: 8px;

}

.bk-live {
  position: absolute;
  width: 1px;
  height: 1px;

@media (max-width: 680px) {

    grid-template-columns: repeat(2, 1fr);
  }
  .bk-phase-strip {
    grid-template-columns: 1fr;
  }

    grid-template-columns: 1fr;
  }

    <span class="iso-caption">Burj Khalifa (828.0 m / 2,716.5 ft, 163 floors) structural anatomy and bottom-to-top construction chronology. Designed by Skidmore, Owings & Merrill (Chief Structural Engineer William F. Baker and Architect Adrian Smith), the tower solved extreme gravity and desert wind vortex loads through the revolutionary 'Buttressed Core' system. At foundation level, 192 bored cast-in-place friction piles (1.5 m diameter) penetrate 50 meters into deep calcisiltite bedrock, tied together by a 3.7 m thick monolithic reinforced concrete raft (12,500 m³ of C80 concrete, 110,000 tonnes). Above, a central hexagonal concrete torsion core is braced by three buttressing wings radiating at 120° intervals. To prevent destructive cross-wind harmonic resonance (Karman vortex shedding), 26 setback tiers spiral counter-clockwise up the tower, continuously altering the building's aerodynamic cross-section so wind vortices cannot synchronize. High-performance concrete was pumped in a single unbroken vertical stage up to a world-record 606 meters using super-high-pressure Putzmeister pumps during nocturnal shifts with ice added to control hydration heat. Self-climbing Doka SKE 100 jump forms achieved a 3-day floor cycle, followed 25 floors below by 24,348 unitized reflective Low-E glass panels. Spaced every 30 stories, 6 double-height Mechanical Equipment Floors (MEP) house full-story outrigger shear walls that lock the central core to perimeter columns. Above Level 156 (585 m), the superstructure transitions to 4,000 tonnes of structural steel; inside this casing, the 350-tonne, 143-meter steel pinnacle spire was fabricated in 25 modular segments and hydraulically jacked out through the summit using heavy Strand Jacks to complete the world's tallest man-made structure.</span>

function updatePhaseFromProgress(prog) {
  // Map progress (0..1) to Phase index 0..8
  const idx = Math.min(8, Math.floor(prog * 8.999));
  const phase = PHASES[idx];
  state.currentPhaseIdx = idx;

  // Linear interpolation within phase for continuous telemetry
  const pStart = idx / 8.0;
  const pEnd = (idx + 1) / 8.0;
  const f = Math.max(0, Math.min(1, (prog - pStart) / (pEnd - pStart || 1)));

  const nextPhase = PHASES[Math.min(8, idx + 1)];
  state.elevationM = Math.round(phase.elevation + f * (nextPhase.elevation - phase.elevation));
  state.elevationFt = Math.round(state.elevationM * 3.28084);
  state.year = phase.year;
  state.concreteM3 = Math.round(phase.concrete + f * (nextPhase.concrete - phase.concrete));
  state.concreteTonnes = Math.round(state.concreteM3 * 2.5);
  state.pumpBar = Math.round(phase.pump + f * (nextPhase.pump - phase.pump));
  state.panels = Math.round(phase.panels + f * (nextPhase.panels - phase.panels));

  if (teleFloor) teleFloor.textContent = phase.floors;
  if (teleConcrete) teleConcrete.innerHTML = `${(state.concreteM3 / 1000).toFixed(0)}k <small>m³</small>`;
  if (telePump) telePump.innerHTML = `${state.pumpBar} <small>bar</small>`;
  if (telePanels) telePanels.textContent = state.panels.toLocaleString();
  if (teleWind) teleWind.innerHTML = `-${state.windReduction}% <small>vortex</small>`;

  if (scrubPhaseLabel) scrubPhaseLabel.textContent = `${phase.name} (${state.elevationM}m)`;

  // Update phase pills active state
  phasePills.forEach((pill, i) => {
    if (i === idx) {
      pill.setAttribute("data-active", "");
    } else {
      pill.removeAttribute("data-active");
    }
  });

  // Calculate current construction Z threshold in world units
  // World units Z: Bedrock is -28, Ground is 0, Top of concrete is 316, Summit is 460
  // Map elevationM (0 to 828) to world Z (-2.1 to 460)
  const currentZ = -2.1 + (state.elevationM / 828.0) * (460 - (-2.1));

  for (const d of dokaJumpForms) {
    if (currentZ >= 0 && currentZ <= 325) {
      d.style.display = "";
      d.setAttribute("transform", `translate(0, ${dokaScreenY.toFixed(1)})`);
    } else {
      d.style.display = "none";
    }
  }

  // Update Climbing Cranes position
  const craneZ = Math.max(0, Math.min(330, currentZ - 8));
  const craneScreenY = -craneZ * D.cosE * D.k;

      c.setAttribute("transform", `translate(0, ${craneScreenY.toFixed(1)})`);

// Spring Animation for Exploded / Apart mode
function updateApartSprings(dt) {
  let moving = false;
  const sub = dt / SPRING.substeps;

  for (let s = 0; s < SPRING.substeps; s++) {
    for (const id of IDS) {
      const p = piece[id];
      const target = p.pending !== null ? p.pending : p.target;
      const f = -SPRING.stiffness * (p.x - target) - SPRING.damping * p.v;
      p.v += f * sub;
      p.x += p.v * sub;
      if (Math.abs(p.v) > 0.001 || Math.abs(p.x - target) > 0.001) {
        moving = true;
      }
    }
  }

  for (const node of nodes) {
    const p = piece[node.ride];
    if (!p) continue;
    const factor = p.x;
    const dx = node.m[0] * factor;
    const dy = node.m[1] * factor;
    const dz = node.m[2] * factor;

    // Convert 3D offset to 2D screen offset
    const sx = (dx * D.sinA - dy * D.cosA) * D.k;
    const sy = ((dx * D.cosA + dy * D.sinA) * D.sinE - dz * D.cosE) * D.k;

    if (Math.abs(sx) > 0.1 || Math.abs(sy) > 0.1) {
      node.el.setAttribute("transform", `translate(${sx.toFixed(1)}, ${sy.toFixed(1)})`);
    } else {
      node.el.removeAttribute("transform");
    }
  }

  return moving;
}

function setApart(active) {
  apart = active;
  if (apartBtn) {
    if (apart) apartBtn.setAttribute("data-active", "");
    else apartBtn.removeAttribute("data-active");
  }

  // Stagger targets
  STAGGER.forEach((id, index) => {
    const p = piece[id];
    if (!p) return;
    const delay = index * SPRING.stagger * 1000;
    setTimeout(() => {
      p.target = apart ? 1.0 : 0.0;
    }, delay);
  });
}

function setXray(active) {
  xray = active;
  if (xrayBtn) {
    if (xray) xrayBtn.setAttribute("data-active", "");
    else xrayBtn.removeAttribute("data-active");
  }
  if (xray) stage.setAttribute("data-xray-active", "");
  else stage.removeAttribute("data-xray-active");
}

function setWind(active) {
  wind = active;
  if (windBtn) {
    if (wind) windBtn.setAttribute("data-active", "");
    else windBtn.removeAttribute("data-active");
  }
  if (wind) stage.setAttribute("data-wind-active", "");
  else stage.removeAttribute("data-wind-active");
}

function setCranes(active) {
  cranesOnly = active;
  if (cranesBtn) {
    if (cranesOnly) cranesBtn.setAttribute("data-active", "");
    else cranesBtn.removeAttribute("data-active");
  }
  if (cranesOnly) stage.setAttribute("data-cranes-active", "");
  else stage.removeAttribute("data-cranes-active");
}

function setPlay(active) {
  playing = active;
  if (playing && progress >= 0.98) {
    progress = 0.0;
  }
  if (playBtn) {
    if (playing) {
      playBtn.setAttribute("data-active", "");
      if (playLabel) playLabel.textContent = "Pause Animation";
    } else {
      playBtn.removeAttribute("data-active");
      if (playLabel) playLabel.textContent = "Play Construction";
    }
  }
}

function selectPart(partId) {
  selectedPart = partId;
  partBtns.forEach((btn) => {
    if (btn.dataset.part === partId) btn.setAttribute("data-active", "");
    else btn.removeAttribute("data-active");
  });

  if (partId) {
    stage.setAttribute("data-focus", "");
    nodes.forEach((n) => {
      if (n.piece === partId || n.ride === partId) n.el.setAttribute("data-on", "");
      else n.el.removeAttribute("data-on");
    });
    const pInfo = D.pieces[partId];
    if (pInfo && readout) {
      readout.textContent = `${pInfo.name}: ${pInfo.say}`;
    }
  } else {
    stage.removeAttribute("data-focus");
    nodes.forEach((n) => n.el.removeAttribute("data-on"));
    const phase = PHASES[state.currentPhaseIdx];
    if (readout) {
      readout.textContent = `${phase.name} · Elev: ${state.elevationM}m (${state.elevationFt}ft) · Conc: ${(state.concreteM3 / 1000).toFixed(0)}k m³`;
    }
  }
}

// Main Animation Loop
function loop(timestamp) {
  if (!lastTime) lastTime = timestamp;
  const dt = Math.min(0.05, (timestamp - lastTime) / 1000);
  lastTime = timestamp;

  if (playing && !still.matches) {
    // 24 seconds for full construction cycle at 1x
    progress += (dt / 24.0) * playSpeed;
    if (progress > 1.0) {
      progress = 0.0; // Loop seamlessly
    }
    if (slider) slider.value = Math.round(progress * 1000);
    updatePhaseFromProgress(progress);
  }

  updateApartSprings(dt);

  requestAnimationFrame(loop);
}

// Event Listeners
if (playBtn) {
  playBtn.addEventListener("click", () => setPlay(!playing));
}

if (apartBtn) {
  apartBtn.addEventListener("click", () => setApart(!apart));
}

if (xrayBtn) {
  xrayBtn.addEventListener("click", () => setXray(!xray));
}

if (windBtn) {
  windBtn.addEventListener("click", () => setWind(!wind));
}

if (cranesBtn) {
  cranesBtn.addEventListener("click", () => setCranes(!cranesOnly));
}

speedBtns.forEach((btn) => {
  btn.addEventListener("click", () => {
    speedBtns.forEach((b) => b.removeAttribute("data-active"));
    btn.setAttribute("data-active", "");
    playSpeed = Number(btn.dataset.speed || 1.0);
  });
});

if (slider) {
  slider.addEventListener("input", (e) => {
    progress = Number(e.target.value) / 1000;
    updatePhaseFromProgress(progress);
  });
  slider.addEventListener("mousedown", () => setPlay(false));
  slider.addEventListener("touchstart", () => setPlay(false), { passive: true });
}

phasePills.forEach((pill, idx) => {
  pill.addEventListener("click", () => {
    setPlay(false);
    progress = idx / 8.0;
    if (slider) slider.value = Math.round(progress * 1000);
    updatePhaseFromProgress(progress);
    const phase = PHASES[idx];
    if (liveEl) liveEl.textContent = `${phase.name}: ${phase.desc}`;
  });
});

partBtns.forEach((btn) => {
  btn.addEventListener("click", () => {
    const p = btn.dataset.part;
    if (selectedPart === p) {
      selectPart(null);
    } else {
      selectPart(p);
    }
  });
});

// Click on SVG nodes to inspect
assembly.addEventListener("click", (e) => {
  const item = e.target.closest(".it");
  if (item && item.dataset.piece) {
    const p = item.dataset.piece;
    selectPart(selectedPart === p ? null : p);
  } else {
    selectPart(null);
  }
});

// Keyboard Navigation
window.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT") return;
  const key = e.key.toLowerCase();

  if (e.code === "Space") {
    e.preventDefault();
    setPlay(!playing);
  } else if (key === "a") {
    setApart(!apart);
  } else if (key === "c" || key === "x") {
    setXray(!xray);
  } else if (key === "w") {
    setWind(!wind);
  } else if (key === "m") {
    setCranes(!cranesOnly);
  } else if (key === "arrowright") {
    setPlay(false);
    progress = Math.min(1.0, progress + 1 / 8.0);
    if (slider) slider.value = Math.round(progress * 1000);
    updatePhaseFromProgress(progress);
  } else if (key === "arrowleft") {
    setPlay(false);
    progress = Math.max(0.0, progress - 1 / 8.0);
    if (slider) slider.value = Math.round(progress * 1000);
    updatePhaseFromProgress(progress);
  } else if (key >= "0" && key <= "8") {
    const idx = Number(key);
    setPlay(false);
    progress = idx / 8.0;
    if (slider) slider.value = Math.round(progress * 1000);
    updatePhaseFromProgress(progress);
  }
});

// Initial Setup
updatePhaseFromProgress(1.0);
requestAnimationFrame(loop);
</script></body></html>
